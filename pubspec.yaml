name: cutout_burst
description: 'CutoutBurst - Smart image cutout and editing app.'
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  flutter_screenutil: ^5.9.3
  fluttertoast: ^8.2.5
  flutter_switch: ^0.3.2
  sqflite: ^2.3.0
  photo_manager: ^3.3.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  device_info_plus: ^10.1.0
  flutter_image_compress: ^2.3.0
  image: ^4.1.7
  dio: ^5.4.3+1
  google_mlkit_selfie_segmentation: ^0.10.1
  flutter_timezone: ^3.0.0
  share_plus: ^10.1.2
  package_info_plus: ^8.1.2
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/bg/
